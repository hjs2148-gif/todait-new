<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B. 계기판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF; --ink:#0B0B0C; --sub:#6B6F76; --line:#E6E7EA; --acc:#00B894;
  --dim:#8A8E95; --mute:#C4C7CC;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Consolas,monospace;
}
body{background:#ECEDEF;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding:32px 24px 56px;-webkit-font-smoothing:antialiased}
.head{display:flex;align-items:baseline;gap:16px;margin-bottom:32px}
.head h1{font-size:20px;line-height:28px;font-weight:600}
.head span{font-family:var(--mono);font-size:12px;color:var(--sub);letter-spacing:.04em}
.stage{display:flex;flex-wrap:wrap;gap:40px 32px;align-items:flex-start}
figure{width:390px}
figcaption{margin-top:12px;font-size:14px;line-height:20px;color:var(--sub);display:flex;gap:8px}
figcaption b{font-family:var(--mono);font-weight:400;color:var(--ink)}

/* ---------- frame ---------- */
.frame{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);border:1px solid #CDD0D5;border-radius:32px;display:flex;flex-direction:column}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.u{font-size:12px;line-height:16px;color:var(--sub);font-weight:400}
.lb{font-size:12px;line-height:16px;color:var(--sub);letter-spacing:.06em}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 28px 0 28px}
.sb .n{font-size:16px;line-height:24px;font-weight:600}
.sb .ic{display:flex;gap:8px;align-items:center}
.sb svg.i{width:24px;height:24px}

/* segments */
.seg{display:flex;gap:2px}
.seg i{flex:1;height:8px;background:var(--line);border-radius:1px;display:block}
.seg i.on{background:var(--acc)}
.seg i.dn{background:var(--mute)}
.seg i.pt{background:linear-gradient(90deg,var(--acc) var(--p),var(--line) var(--p))}

/* joined cell group */
.grp{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grp>div{padding:8px 12px;min-width:0}
.grp>div+div{border-left:1px solid var(--line)}
.val{display:flex;align-items:baseline;gap:2px;white-space:nowrap}

/* buttons */
.btn{height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;line-height:24px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--ink)}
.btn.ink{background:var(--ink);color:#fff}
.btn.out{border:1px solid var(--ink);color:var(--ink);background:#fff}
.btn.sq{border:1px solid var(--line);color:var(--ink);background:#fff}

/* tab bar */
.tabbar{flex:none;height:84px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:24px;position:relative;background:#fff}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:12px;line-height:16px}
.tb.on{color:var(--ink);font-weight:600}
.tb.on::before{content:"";position:absolute;top:-1px;left:16px;right:16px;height:2px;background:var(--acc)}
.hi{position:absolute;left:50%;bottom:8px;width:134px;height:4px;margin-left:-67px;border-radius:2px;background:var(--ink)}

/* ---------- 01 today ---------- */
.t-head{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 20px 0}
.t-head .d{font-size:20px;line-height:28px;font-weight:600}
.t-head .dd{text-align:right}
.t-head .dd .n{font-size:20px;line-height:28px;font-weight:600;display:block}
.t-metrics{margin:16px 20px 0;grid-template-columns:1fr 1.5fr 1fr}
.t-metrics>div{padding:12px}
.t-metrics .val .n{font-size:32px;line-height:36px;font-weight:600}
.t-bar{margin:12px 20px 0}
.t-bar .ax{display:flex;justify-content:space-between;margin-top:4px}
.t-bar .ax .n{font-size:12px;line-height:16px;color:var(--sub)}
.t-lh{margin:20px 20px 0;display:flex;justify-content:space-between;align-items:center;height:32px;border-bottom:1px solid var(--ink)}
.t-lh .n{color:var(--ink)}
.pr{margin:0 20px;padding:16px 0;border-bottom:1px solid var(--line)}
.pr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pr .nm{font-size:16px;line-height:24px;font-weight:600}
.pr .st{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--sub);white-space:nowrap}
.pr .st .n{color:var(--sub)}
.pr .dot{width:8px;height:8px;background:var(--acc);display:block;border-radius:1px;flex:none}
.pr .st svg.i{width:16px;height:16px}
.pr .rt{text-align:right;flex:none}
.pr .rt .val{justify-content:flex-end}
.pr .rt .n.b{font-size:20px;line-height:24px;font-weight:600}
.pr .rt .tm{font-size:12px;line-height:16px;color:var(--sub);display:block}
.pr .seg{margin-top:12px}
.pr.done .nm{text-decoration:line-through;color:var(--dim);font-weight:400}
.pr.done .rt .n.b{color:var(--dim)}
.chk{width:24px;height:24px;border-radius:4px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.chk svg.i{width:16px;height:16px;stroke-width:1.5}
.chk.mu{background:var(--mute)}
.t-act{margin-top:auto;padding:12px 20px 12px;display:grid;grid-template-columns:48px 1fr 1.5fr;gap:8px}

/* ---------- 02 new plan ---------- */
.p-nav{height:44px;flex:none;display:flex;align-items:center;padding:0 8px 0 8px}
.p-nav .x{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.p-nav .t{font-size:16px;line-height:24px;font-weight:600}
.p-form{flex:1;min-height:0;padding:4px 20px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.fl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.inp{height:44px;border:1px solid var(--ink);border-radius:8px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-size:16px}
.inp .n{font-size:12px;color:var(--sub)}
.typ{grid-template-columns:repeat(4,1fr)}
.typ>div{padding:0;height:42px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;color:var(--sub)}
.typ>div.on{background:var(--ink);color:#fff;font-weight:600}
.rng{grid-template-columns:1fr 1fr 96px}
.rng .n.v,.per .n.v{font-size:20px;line-height:24px;font-weight:600}
.rng .v2{font-size:20px;line-height:24px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.per{grid-template-columns:1fr 1fr}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk>div{height:44px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;color:var(--sub)}
.wk>div.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.wk>div.off{color:var(--dim);border-style:dashed;border-color:var(--mute)}
.wk>div.pick{border:2px solid var(--ink);color:var(--ink);font-weight:600}
.prev{border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.prev .ln{font-size:20px;line-height:28px;font-weight:600;margin-top:4px}
.prev .tk{display:flex;gap:2px;margin-top:12px}
.prev .tk i{flex:1;height:16px;background:var(--ink);border-radius:1px;display:block}
.prev .tk i.o{background:transparent;border:1px solid var(--ink)}
.prev .ax{display:flex;justify-content:space-between;margin-top:4px}
.prev .ax .n{font-size:12px;line-height:16px;color:var(--sub)}
.sel{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-size:16px}
.sel .l{display:flex;align-items:center;gap:8px}
.sel .sq{width:8px;height:8px;background:var(--ink);border-radius:1px}
.p-save{flex:none;padding:12px 20px 32px;border-top:1px solid var(--line)}

/* ---------- 03 stats ---------- */
.s-head{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 0;height:52px}
.s-head h2{font-size:20px;line-height:28px;font-weight:600}
.tg{grid-template-columns:56px 56px}
.tg>div{padding:0;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub)}
.tg>div.on{background:var(--ink);color:#fff;font-weight:600}
.s-per{display:flex;justify-content:space-between;align-items:center;padding:0 8px 0 20px;height:44px}
.s-per .l{display:flex;align-items:baseline;gap:8px}
.s-per .l .n{font-size:16px;line-height:24px;font-weight:600}
.s-per .bt{display:flex}
.s-per .bt div{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.s-hero{margin:0 20px 0}
.s-hero .big{display:flex;align-items:baseline;gap:4px;margin-top:4px}
.s-hero .big .n{font-size:48px;line-height:48px;font-weight:600}
.s-hero .big .u{font-size:16px;line-height:24px;margin-right:8px}
.s-two{margin-top:8px;grid-template-columns:1fr 1fr}
.s-two>div{padding:12px}
.s-two .val .n{font-size:20px;line-height:24px;font-weight:600}
.s-two .seg{margin-top:8px}
.s-sec{margin:16px 20px 0}
.s-sh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);height:28px;padding-bottom:4px;align-items:flex-start}
.chart{position:relative;height:168px;margin-top:12px}
.chart .gl{position:absolute;left:28px;right:0;border-top:1px solid var(--line)}
.chart .gl.z{border-top-color:var(--ink)}
.chart .yl{position:absolute;left:0;width:20px;text-align:left;font-size:12px;line-height:16px;color:var(--sub);transform:translateY(-8px)}
.chart .avg{position:absolute;left:28px;right:0;bottom:98px;border-top:1px dashed var(--sub)}
.chart .cols{position:absolute;left:28px;right:0;top:0;bottom:0;display:flex}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col .v{font-size:12px;line-height:16px;color:var(--sub);margin-bottom:2px}
.col .b{width:20px;background:repeating-linear-gradient(to top,var(--c,var(--ink)) 0 12px,transparent 12px 14px)}
.col.today .v{color:var(--ink);font-weight:600}
.xl{display:flex;margin-left:28px;margin-top:4px}
.xl>div{flex:1;text-align:center;font-size:12px;line-height:16px;color:var(--sub)}
.xl>div .n{display:block}
.xl>div.today{color:var(--ink);font-weight:600}
.xl>div.today .n{font-weight:600}
.sub-bar{display:flex;gap:2px;height:16px;margin-top:8px}
.sub-bar i{display:block;height:16px;border-radius:1px}
.sr{display:flex;align-items:center;justify-content:space-between;height:44px;border-bottom:1px solid var(--line)}
.sr .l{display:flex;align-items:center;gap:12px;font-size:16px;line-height:24px}
.sr .l i{width:12px;height:12px;border-radius:2px;display:block}
.sr .val .n{font-size:20px;line-height:24px;font-weight:600}

/* ---------- 04 stopwatch ---------- */
.w-top{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 8px}
.w-top .x{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.w-top .rec{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--sub);letter-spacing:.06em}
.w-top .rec i{width:8px;height:8px;background:var(--acc);border-radius:1px;display:block}
.w-id{padding:32px 20px 0}
.w-id .nm{font-size:20px;line-height:28px;font-weight:600;margin-top:4px}
.w-id .sb2{font-size:12px;line-height:16px;color:var(--sub);margin-top:4px}
.w-time{padding:48px 20px 0}
.w-time .t{font-size:64px;line-height:70px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;margin-top:4px}
.w-time .t span{color:var(--mute)}
.ruler{position:relative;margin:24px 20px 0;padding-bottom:20px}
.ruler .tk{display:flex;gap:2px;align-items:flex-end;height:24px}
.ruler .tk i{flex:1;height:12px;background:var(--line);display:block}
.ruler .tk i.m{height:24px}
.ruler .tk i.on{background:var(--acc)}
.ruler .tk i.pt{background:linear-gradient(90deg,var(--acc) var(--p),var(--line) var(--p))}
.ruler .tk i.off.m{background:var(--mute)}
.ruler .lab{position:absolute;bottom:0;font-size:12px;line-height:16px;color:var(--sub)}
.w-stat{margin:24px 20px 0;grid-template-columns:1fr 1fr}
.w-stat>div{padding:12px}
.w-stat .span{grid-column:1 / 3;border-left:0;border-top:1px solid var(--line)}
.w-stat .val .n{font-size:32px;line-height:36px;font-weight:600}
.w-stat .val .n.s{font-size:20px;line-height:24px}
.w-stat .seg{margin-top:12px}
.w-act{margin-top:auto;padding:0 20px 32px;display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.w-act .btn{height:56px}
</style>
</head>
<body>

<div class="head"><h1>B. 계기판</h1><span>INSTRUMENT · 390 × 844 · #00B894 · PRETENDARD + JETBRAINS MONO</span></div>

<div class="stage">

<!-- ================= 01 오늘 ================= -->
<figure>
<div class="frame">
  <div class="sb"><span class="n">9:41</span><span class="ic"><svg class="i"><use href="#i-sig"/></svg><svg class="i"><use href="#i-bat"/></svg></span></div>
  <div class="scr">
    <div class="t-head">
      <div>
        <div class="lb">월요일</div>
        <div class="d"><span class="n">11</span>월 <span class="n">16</span>일</div>
      </div>
      <div class="dd">
        <div class="lb">기말고사</div>
        <span class="n">D-24</span>
      </div>
    </div>

    <div class="grp t-metrics">
      <div>
        <div class="lb">성취율</div>
        <div class="val"><span class="n">62</span><span class="u">%</span></div>
      </div>
      <div>
        <div class="lb">공부 시간</div>
        <div class="val"><span class="n">3</span><span class="u">시간</span><span class="n" style="margin-left:4px">42</span><span class="u">분</span></div>
      </div>
      <div>
        <div class="lb">완료 계획</div>
        <div class="val"><span class="n">2</span><span class="u">/ 4개</span></div>
      </div>
    </div>

    <div class="t-bar">
      <div class="seg">
        <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
        <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
        <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
        <i class="pt" style="--p:50%"></i>
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="ax"><span class="n">0</span><span class="n">100%</span></div>
    </div>

    <div class="t-lh"><span class="lb">계획 <span class="n">04</span></span><span class="lb">오늘 분량 / 진행</span></div>

    <div class="pr">
      <div class="pr-top">
        <div>
          <div class="nm">수학의 정석</div>
          <div class="st"><i class="dot"></i>진행 중 · 수학 · 오늘 <span class="n">121~135</span>쪽</div>
        </div>
        <div class="rt">
          <div class="val"><span class="n b">9</span><span class="u">/ 15쪽</span></div>
          <span class="tm"><span class="n">1</span>시간 <span class="n">20</span>분</span>
        </div>
      </div>
      <div class="seg"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="pr done">
      <div class="pr-top">
        <div>
          <div class="nm">영단어</div>
          <div class="st"><svg class="i"><use href="#i-check"/></svg>완료 · 영어 · <span class="n">30</span>개</div>
        </div>
        <div class="rt">
          <div class="val"><span class="n b">30</span><span class="u">/ 30개</span></div>
          <span class="tm"><span class="n">25</span>분</span>
        </div>
      </div>
      <div class="seg"><i class="dn"></i><i class="dn"></i><i class="dn"></i><i class="dn"></i><i class="dn"></i><i class="dn"></i><i class="dn"></i><i class="dn"></i><i class="dn"></i><i class="dn"></i></div>
    </div>

    <div class="pr">
      <div class="pr-top">
        <div>
          <div class="nm">비문학 인강</div>
          <div class="st"><i class="dot"></i>진행 중 · 국어 · 시간 계획</div>
        </div>
        <div class="rt">
          <div class="val"><span class="n b">1</span><span class="u">시간</span><span class="n b" style="margin-left:4px">12</span><span class="u">분</span></div>
          <span class="tm">/ <span class="n">2</span>시간</span>
        </div>
      </div>
      <div class="seg"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="pr done" style="border-bottom:0;padding-bottom:8px">
      <div class="pr-top" style="align-items:center">
        <div>
          <div class="nm">아침 스트레칭</div>
          <div class="st"><svg class="i"><use href="#i-check"/></svg>완료 · 체크 계획</div>
        </div>
        <div class="chk mu"><svg class="i"><use href="#i-check"/></svg></div>
      </div>
