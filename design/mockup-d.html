<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todait 시안 D. 갤러리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap">
<style>
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --ink:#111110; --sub:#66645E; --line:#DEDCD5; --accent:#1E4B3A;
  --mute:#8C897F; /* chart bars (non-text) */
  --sans:'Pretendard Variable','Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --num:'Geist','Pretendard Variable','Pretendard',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E7E5DE;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;padding:32px 24px 48px}
h1{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.01em;max-width:1720px;margin:0 auto 24px}
h1 span{font-weight:400;color:var(--sub);font-size:16px;margin-left:12px}
.row{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;max-width:1720px;margin:0 auto}
figure{width:390px}
figcaption{font-size:13px;line-height:20px;letter-spacing:.04em;color:#4A4842;margin-top:12px}

/* frame */
.frame{width:390px;height:844px;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;position:relative}
.body{flex:1;min-height:0;padding:0 20px;display:flex;flex-direction:column}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:16px;height:16px}

/* type */
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lab{font-size:13px;line-height:20px;letter-spacing:.04em;color:var(--sub)}
.v28{font-size:28px;line-height:36px;font-weight:400;letter-spacing:-.03em}
.u16{font-size:16px;font-weight:400;letter-spacing:0}
.u13{font-size:13px;font-weight:400;letter-spacing:.02em;color:var(--sub)}
.hero{font-weight:400;letter-spacing:-.03em;line-height:1;display:block}
.hero-wrap{display:flex;align-items:baseline}
.hero-wrap .unit{font-size:28px;line-height:1;font-weight:400;color:var(--ink);margin-left:6px}
b{font-weight:600}

/* thin bar */
.bar{height:2px;background:var(--line);width:100%}
.bar i{display:block;height:100%;background:var(--accent)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:2px;font-size:16px;font-weight:600;background:var(--ink);color:#fff;border:1px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.actions{display:flex;gap:8px;padding:12px 20px 16px}

/* tab bar */
.tabs{height:72px;border-top:1px solid var(--line);display:flex;padding:8px 8px 12px;background:var(--bg)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:13px;line-height:18px;letter-spacing:.02em;min-height:48px}
.tabs a.on{color:var(--ink);font-weight:600}

/* ---------- 1. 오늘 ---------- */
.topline{display:flex;justify-content:space-between;align-items:center;margin-top:24px;height:24px}
.topline .d{font-weight:600}
.topline .dd{color:var(--ink)}
.t-hero{margin-top:32px}
.t-hero .bar{margin-top:16px}
.t-stats{display:grid;grid-template-columns:1fr 1fr;margin-top:20px}
.t-stats>div+div{border-left:1px solid var(--line);padding-left:20px}
.t-stats .v28{margin-top:0}
.list-h{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px;padding-bottom:8px}
.plans{border-top:1px solid var(--ink)}
.plan{display:grid;grid-template-columns:20px 1fr auto;column-gap:8px;padding:12px 0 10px}
.plan .bar{grid-column:1 / -1;margin-top:10px}
.plan .ck{width:20px;height:24px;display:flex;align-items:center;color:var(--accent)}
.plan .ring{width:16px;height:16px;border:1.75px solid var(--ink);border-radius:50%}
.plan .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan.done .nm{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--sub);font-weight:400}
.plan .sb{font-size:13px;line-height:20px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;flex:none}
.plan .rt{text-align:right;grid-row:1 / 3;grid-column:3;display:flex;flex-direction:column;align-items:flex-end}
.plan .rt .v28{line-height:32px}
.plan .rt .u13{line-height:18px}
.plan .txt{grid-column:2;min-width:0}
.plan .ckc{grid-column:1;grid-row:1 / 3;padding-top:4px}

/* ---------- 2. 새 계획 ---------- */
.nav{display:flex;align-items:center;height:56px;margin:8px -8px 0;gap:4px}
.nav .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.nav .tt{font-weight:600}
.f{margin-top:20px}
.f .field{border-bottom:1px solid var(--ink);height:40px;display:flex;align-items:center;justify-content:space-between}
.f .field.soft{border-bottom-color:var(--line)}
.kinds{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:2px;margin-top:4px}
.kinds div{height:48px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:16px;color:var(--sub);border-left:1px solid var(--line)}
.kinds div:first-child{border-left:0}
.kinds div.on{background:var(--ink);color:#fff;font-weight:600;border-left-color:var(--ink)}
.grid3{display:grid;grid-template-columns:1fr 1fr 72px;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field .v28{line-height:36px}
.days{display:flex;gap:2px;margin-top:4px}
.days div{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:2px;border:1px dashed var(--mute);color:var(--sub);font-size:16px}
.days div.on{background:var(--ink);border:1px solid var(--ink);color:#fff;font-weight:600}
.f-h{display:flex;justify-content:space-between;align-items:flex-end}
.pv{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:flex-end}
.pv .hero-wrap .unit{margin-left:4px}
.pv .r{text-align:right;padding-bottom:6px}
.save{padding:12px 20px 20px}
.save .btn{height:52px}

/* ---------- 3. 통계 ---------- */
.s-head{display:flex;justify-content:space-between;align-items:center;margin-top:16px;height:48px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px}
.seg div{width:64px;height:40px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub)}
.seg div.on{background:var(--ink);color:#fff;font-weight:600}
.pnav{display:flex;align-items:center;justify-content:space-between;height:48px;margin:0 -12px}
.pnav .a{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.s-hero{margin-top:8px}
.s-hero .hero-wrap{margin-top:0}
.s-hero .unit{margin-left:4px;margin-right:12px}
.s-stats{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.s-stats>div+div{border-left:1px solid var(--line);padding-left:20px}
.chart{margin-top:20px;display:grid;grid-template-columns:repeat(7,1fr);align-items:end;column-gap:8px;height:158px;border-bottom:1px solid var(--ink)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col .val{font-size:13px;line-height:20px;color:var(--sub);margin-bottom:4px}
.col .bx{width:100%;max-width:28px;background:var(--mute)}
.col.today .bx{background:var(--accent)}
.col.today .val{color:var(--ink);font-weight:600}
.axis{display:grid;grid-template-columns:repeat(7,1fr);column-gap:8px;margin-top:6px}
.axis div{text-align:center;font-size:13px;line-height:20px;color:var(--sub)}
.axis div.today{color:var(--ink);font-weight:600}
.share{margin-top:20px;border-top:1px solid var(--ink)}
.share .it{padding:8px 0 0;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
.share .it .bar{grid-column:1 / -1;margin-top:8px}
.share .nm{display:flex;align-items:center;font-weight:600}
.share .p{text-align:right;display:flex;align-items:baseline;gap:8px}

/* ---------- 4. 스톱워치 ---------- */
.sw-top{display:flex;align-items:center;height:56px;margin:8px -8px 0}
.sw-top .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.sw-mid{margin-top:156px}
.sw-ttl{margin-bottom:0}
.sw-state{display:flex;align-items:center;margin-top:48px}
.sw-time{margin-top:12px;font-size:76px;line-height:76px;font-weight:400;letter-spacing:-.03em;white-space:nowrap}
.sw-line{height:1px;background:var(--ink);margin-top:20px}
.sw-bot{margin-top:auto;padding-bottom:20px}
.sw-acc{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-bottom:20px}
.sw-bot .btn{height:56px}
</style>
</head>
