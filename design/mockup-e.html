<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E. 벤토 - Todait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&display=swap">
<style>
:root{
  --bg:#ECEEF0; --tile:#FFFFFF; --ink:#0F1113; --sub:#5B6168; --lime:#C8F03C;
  --track:#E3E6E9; --field:#ECEEF0; --on-ink-sub:#B8BEC4; --track-ink:#2B2F33; --bar-off:#9AA1A8;
  --fb:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --fn:'Manrope','Pretendard Variable',Pretendard,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F8F9FA;color:var(--ink);font:500 16px/24px var(--fb);padding:32px;-webkit-font-smoothing:antialiased}
h1.page{font:700 28px/32px var(--fb);letter-spacing:-.02em}
p.lead{font-size:16px;line-height:24px;color:var(--sub);margin:4px 0 32px}
.row{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
figure{width:390px}
figcaption{font:700 16px/24px var(--fb);margin-top:12px}

/* ---------- frame ---------- */
.frame{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);border-radius:44px;padding:0 20px;outline:1px solid #D5D9DD}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding-top:12px;font:700 13px/16px var(--fb)}
.status .i{width:24px;height:24px}
.stack{display:flex;flex-direction:column;gap:8px}

/* ---------- primitives ---------- */
.i{width:24px;height:24px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile{background:var(--tile);border-radius:24px;padding:16px;min-width:0}
.tile.ink{background:var(--ink);color:#fff}
.lab{font-size:13px;line-height:16px;letter-spacing:.02em;color:var(--sub);white-space:nowrap}
.ink .lab{color:var(--on-ink-sub)}
.b{font-weight:700}
.n{font-family:var(--fn);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.n28{font-size:28px;line-height:32px}
.n56{font-size:56px;line-height:56px}
.n64{font-size:64px;line-height:64px}
.u{font:700 16px/24px var(--fb);margin-left:2px}
.u28{font:700 28px/32px var(--fb);margin-left:2px;letter-spacing:-.02em}
.val{display:flex;align-items:baseline;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ink)}
.ink .bar{background:var(--track-ink)}
.circ{width:48px;height:48px;border-radius:24px;background:var(--tile);display:flex;align-items:center;justify-content:center;flex:none}
h1.t{font:700 28px/32px var(--fb);letter-spacing:-.02em}
.head{height:48px;display:flex;align-items:center;gap:12px}

/* ---------- tab bar ---------- */
.tabs{position:absolute;left:16px;right:16px;bottom:16px;height:64px;border-radius:32px;background:var(--ink);display:flex;padding:0 8px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on-ink-sub);font-size:13px;line-height:16px}
.tab .o{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.tab.on{color:#fff;font-weight:700}
.tab.on .o{background:var(--lime);color:var(--ink)}

/* ---------- 오늘 ---------- */
.today .head{height:32px;margin-bottom:8px}
.bento{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:92px 92px;gap:8px;margin-bottom:8px}
.bento .hero{grid-row:1/3;display:flex;flex-direction:column;justify-content:space-between}
.hero .big{display:flex;align-items:baseline;color:var(--lime)}
.hero .big .n28{margin-left:2px}
.hero .bar i{background:var(--lime)}
.hero .cap{font-size:13px;line-height:16px;color:#fff;white-space:nowrap}
.mini{display:flex;flex-direction:column;justify-content:space-between}
.plans{display:flex;flex-direction:column;gap:8px}
.plan .r{display:grid;grid-template-columns:minmax(0,1fr) auto 48px;column-gap:12px;align-items:center;min-height:48px}
.plan.done .r{grid-template-columns:minmax(0,1fr) auto}
.plan .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan.done .nm{text-decoration:line-through;text-decoration-thickness:2px;color:var(--sub)}
.plan .sb{font-size:13px;line-height:16px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .v{display:flex;flex-direction:column;align-items:flex-end}
.plan .v .sb{margin-top:0}
.go{width:48px;height:48px;border-radius:24px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.go .i path{fill:currentColor}
.plan .br{display:flex;align-items:center;gap:12px;margin-top:8px;height:16px}
.plan .br .bar{flex:1}
.plan .st{font:700 13px/16px var(--fb);display:flex;align-items:center;gap:4px;white-space:nowrap;min-width:52px;justify-content:flex-end}
.plan .st .i{width:16px;height:16px;stroke-width:2}
.plan.chk .r{grid-template-columns:minmax(0,1fr) auto}
.plan.chk .st{font-size:16px;line-height:24px}
.plan.chk .st .i{width:20px;height:20px}
.add{height:48px;border-radius:24px;background:var(--tile);display:flex;align-items:center;gap:12px;padding:0 8px;font-weight:700}
.add .p{width:32px;height:32px;border-radius:16px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.add .p .i{width:20px;height:20px;stroke-width:2}

/* ---------- 새 계획 ---------- */
.form .head{margin-bottom:8px}
.form .tile{padding:16px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cell{height:48px;border-radius:12px;background:var(--field);display:flex;align-items:center;justify-content:center;gap:4px;font-size:16px;line-height:24px;color:var(--sub);white-space:nowrap}
.cell.on{background:var(--ink);color:#fff;font-weight:700}
.cell .i{width:16px;height:16px;stroke-width:2}
.tile.tp{padding:12px 16px}
.val16{font-weight:700;white-space:nowrap}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.days .cell{padding:0}
.save{position:absolute;left:20px;right:20px;bottom:20px;height:56px;border-radius:28px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.prev{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.prev .val{align-items:baseline}
.prev .n56{color:#fff}
.prev .lab{margin-bottom:4px}
.prev .u{font-size:16px}

/* ---------- 통계 ---------- */
.stats .head{justify-content:space-between;margin-bottom:8px}
.stats .nav{display:flex;align-items:center;gap:4px}
.stats .nav .circ.dis{color:var(--bar-off)}
.stats .per{font-family:var(--fn);font-weight:700;font-size:16px;line-height:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 4px}
.segc{height:48px;border-radius:24px;background:var(--tile);padding:4px;display:flex;gap:0}
.segc span{width:52px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub)}
.segc span.on{background:var(--ink);color:#fff;font-weight:700}
.stats .hero{height:112px;display:flex;flex-direction:column;justify-content:space-between}
.stats .hero .val{color:var(--lime);align-items:baseline}
.stats .hero .val .u28{color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .tile{height:88px;display:flex;flex-direction:column;justify-content:space-between}
.chart{height:216px;display:flex;flex-direction:column}
.cols7{display:grid;grid-template-columns:repeat(7,1fr);margin-top:auto}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.col .vl{font-size:13px;line-height:16px;color:var(--sub);margin-bottom:4px;font-family:var(--fn);font-weight:700;letter-spacing:-.02em}
.col .br2{width:24px;border-radius:8px;background:var(--bar-off)}
.col .dy{margin-top:8px;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:16px;color:var(--sub)}
.col.today .vl{color:var(--ink)}
.col.today .br2{background:var(--ink)}
.col.today .dy{background:var(--ink);color:#fff;font-weight:700}
.subj{height:204px}
.srow{height:40px;margin-top:12px}
.srow:first-of-type{margin-top:0}
.sl{display:flex;align-items:baseline;gap:8px;height:24px;margin-bottom:8px}
.sl .nm{font-weight:700}
.sl .tm{font-size:13px;line-height:16px;color:var(--sub)}
.sl .pc{margin-left:auto;font-family:var(--fn);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sl .pc small{font:700 13px/16px var(--fb);margin-left:1px}
.subj .bar i.a{background:var(--ink)}
.subj .bar i.b2{background:#5B6168}
.subj .bar i.c{background:var(--bar-off)}

/* ---------- 스톱워치 ---------- */
.sw .head{margin-bottom:8px}
.sw .plan1{height:88px;display:flex;flex-direction:column;justify-content:space-between}
.sw .plan1 .t{font:700 28px/32px var(--fb);letter-spacing:-.02em}
.swhero{height:476px;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.swhero .top{display:flex;justify-content:space-between;align-items:center}
.swhero .run{display:flex;align-items:center;gap:4px;font:700 13px/16px var(--fb);color:#fff}
.swhero .run .i{width:16px;height:16px;stroke-width:2}
.swhero .time{font-size:72px;line-height:72px;color:#fff;white-space:nowrap;margin-left:-2px}
.swhero .time em{font-style:normal;color:#8A9199}
.swhero .scale{display:flex;justify-content:space-between;margin-top:8px}
.swhero .bar i{background:#fff}
.acc{height:80px;display:flex;flex-direction:column;justify-content:space-between}
.stopbtn{position:absolute;left:20px;right:20px;bottom:20px;height:56px;border-radius:28px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.stopbtn .i{width:20px;height:20px}
.stopbtn .i rect{fill:currentColor}
</style>
</head>

    <symbol id="more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.25"/><circle cx="12" cy="12" r="1.25"/><circle cx="18" cy="12" r="1.25"/></symbol>

<h1 class="page">E. 벤토</h1>
<p class="lead">Bento · 먹색 타일 하나와 라임 한 점</p>

<div class="row">

<!-- ============ 1. 오늘 ============ -->
<figure>
<div class="frame today">
  <div class="status"><span>9:41</span><svg class="i"><use href="#batt"/></svg></div>
  <div class="head"><h1 class="t">11월 16일 월요일</h1></div>

  <div class="plans">
    <article class="tile plan">
      <div class="r">

        <div class="go" aria-label="스톱워치 시작"><svg class="i"><use href="#play"/></svg></div>
      </div>

      </div>

    <article class="tile plan done chk" style="padding:16px">
      <div class="r">
        <div style="min-width:0"><p class="nm">아침 스트레칭</p><p class="sb">체크 계획</p></div>
        <span class="st"><svg class="i"><use href="#check"/></svg>완료</span>

</div>
<figcaption>오늘</figcaption>
</figure>

<!-- ============ 2. 새 계획 ============ -->

<div class="frame form">

<!-- ============ 3. 통계 ============ -->
<figure>
<div class="frame stats">
  <div class="status"><span>9:41</span><svg class="i"><use href="#batt"/></svg></div>
  <div class="head">
    <div class="nav">
      <div class="circ" aria-label="이전 기간"><svg class="i"><use href="#chl"/></svg></div>
      <span class="per">11.10 ~ 11.16</span>
      <div class="circ dis" aria-label="다음 기간"><svg class="i"><use href="#chr"/></svg></div>
    </div>
    <div class="segc"><span class="on">주간</span><span>월간</span></div>
  </div>

  <div class="stack">
    <section class="tile ink hero">
      <span class="lab">총 공부 시간</span>
      <div class="val"><span class="n n56">21</span><span class="u28">시간</span><span class="n n56" style="margin-left:8px">5</span><span class="u28">분</span></div>
    </section>

    <div class="two">
      <section class="tile">
        <span class="lab">공부한 날 평균</span>
        <div class="val"><span class="n n28">3</span><span class="u">시간</span><span class="n n28" style="margin-left:4px">30</span><span class="u">분</span></div>
